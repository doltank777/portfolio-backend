spring.application.name=portfolio

# =========================
# 서버 설정
# =========================
server.port=8080

# =========================
# 활성 프로파일
# =========================
spring.profiles.active=dev

# =========================
# DB (MySQL)
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=portfolio_user
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA 설정
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# MySQL 최적화 Dialect (Spring Boot 3는 자동 인식하지만 명시 가능)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# HikariCP 커넥션풀
# =========================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# =========================
# JWT 설정
# =========================
jwt.secret=mysupersecretkeymysupersecretkey123
jwt.expiration=3600000

# =========================
# Redis 설정
# =========================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 🔥 Redis Repository 자동 스캔 비활성화 (경고 제거)
spring.data.redis.repositories.enabled=false

# =========================
# Redis Key Prefix
# =========================
redis.like.count.prefix=post:like:count:
redis.like.user.prefix=post:like:user:

# =========================
# 로그 레벨
# =========================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE