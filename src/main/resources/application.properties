spring.application.name=portfolio

# =========================
# ?? ??
# =========================
server.port=8080

# =========================
# DB (MySQL)
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio
spring.datasource.username=portfolio_user
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# JWT ??
# =========================
jwt.secret=mysupersecretkeymysupersecretkey123
jwt.expiration=3600000

# =========================
# Redis ??
# =========================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# =========================
# Redis Key Prefix
# =========================
redis.like.count.prefix=post:like:count:
redis.like.user.prefix=post:like:user: